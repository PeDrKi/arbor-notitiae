# Chạy kiểm thử mỗi lần đẩy code: logic dữ liệu (tests/kiem-thu.js) và kiểm tra app.js khớp các file nguồn trong js/.
name: Kiểm thử
on: [push, pull_request]
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/kiem-thu.js
